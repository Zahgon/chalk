name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go-version:
          - stable
          - oldstable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
